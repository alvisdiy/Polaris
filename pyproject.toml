[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-knowledge-pipeline"
version = "0.1.0"
description = "Official-source scholarship ingestion pipeline for Polaris"
requires-python = ">=3.11"

[project.scripts]
polaris-knowledge = "knowledge_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["knowledge_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers -v"
markers = [
    "unit: Unit tests (mock-based, no DB)",
    "integration: Integration tests (DB-dependent)",
    "api: API endpoint tests (TestClient)",
    "slow: Slow tests (network or heavy IO)",
]

[tool.coverage.run]
source = ["services", "api", "database"]
omit = [
    "database/migrations/*",
    "services/ingestion/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

