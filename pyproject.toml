[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-knowledge-pipeline"
version = "0.1.0"
description = "Official-source scholarship ingestion pipeline for Polaris"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "loguru>=0.7",
    "playwright>=1.45",
    "trafilatura>=1.8",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # PDF pamphlets are fetched as bytes by the Playwright connector and parsed
    # with pypdf. It is a runtime dependency of acquisition, not a dev extra.
    "pypdf>=4.0",
    # Free web-search backend for the discovery surface (POLARIS_SEARCH_PROVIDER=ddgs).
    # Optional at runtime — the provider imports it lazily — but installed by
    # default so a fresh clone can run live discovery without Serper credits.
    "ddgs>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

# No console scripts: the previous `polaris-knowledge` entry point referenced
# `knowledge_pipeline.cli`, a module that does not exist in this repository.
# Installing it produced a console script that failed on import.

[tool.setuptools.packages.find]
# The application packages live at the repository root (api/, services/,
# database/), not under a src/ tree. Include them explicitly so `pip install .`
# installs the code it declares dependencies for.
include = ["api*", "services*", "database*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers -v"
markers = [
    "unit: Unit tests (mock-based, no DB)",
    "integration: Integration tests (DB-dependent)",
    "api: API endpoint tests (TestClient)",
    "slow: Slow tests (network or heavy IO)",
    "data: Requires the development knowledge base (skipped unless POLARIS_RUN_DATA_TESTS=1)",
]

[tool.coverage.run]
source = ["services", "api", "database"]
omit = [
    "database/migrations/*",
]

[tool.coverage.report]
# Recalibrated in the post-M10 milestone, not lowered to make a run pass.
#
# `services/ingestion/*` was omitted from `source` until now, which made the
# suite report 91.40% while never measuring the extraction and safety code
# that decides what enters the knowledge base. With ingestion included the
# true figure is 85.60%, and the previously invisible gaps are large:
# strategy_factory 0%, generic_playwright 12%, discovery 27%,
# country_orchestrator 38%, mext_connector 47%.
#
# The gate is a ratchet against silent decline, not a target. It now sits
# below the honest measurement so that a drop is still a failure, and the gap
# to 90% is tracked in the milestone report as real work rather than closed
# with tests written only to move the number.
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".services"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Line length is a style guard on production code. Fixture HTML, long URLs in
# ops scripts and generated migrations are not improved by wrapping them, and
# wrapping them makes the data harder to diff. Correctness rules (F, E7) still
# apply everywhere.
"tests/**" = ["E501"]
"scripts/**" = ["E501"]
"database/migrations/**" = ["E501"]

