name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Pytest + Coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: PYTHONPATH=. python -m pytest tests/unit/ -v --tb=short -m unit
        env:
          POLARIS_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/polaris_test
      - name: Run all tests with coverage
        run: PYTHONPATH=. python -m pytest tests/ -v --tb=short --cov --cov-report=term-missing --cov-fail-under=85
        env:
          POLARIS_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/polaris_test
