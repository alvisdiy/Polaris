name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Pytest + Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: PYTHONPATH=. python -m pytest tests/unit/ -v --tb=short -m unit
        env:
          DATABASE_URL: sqlite:///./test.db
      - name: Run all tests with coverage
        run: PYTHONPATH=. python -m pytest tests/ -v --tb=short --cov --cov-report=term-missing --cov-fail-under=90
        env:
          DATABASE_URL: sqlite:///./test.db
